name: Build and Push Docker Image to Docker Hub

# Robot ini akan otomatis aktif setiap kali ada kode baru yang di-push ke branch main
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Mengunduh source code aplikasi Anda ke server GitHub Actions
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Menyiapkan sistem Docker Buildx agar proses build lebih cepat
    - name: Set up Docker Buildx
      uses: actions/setup-buildx-action@v3

    # 3. Login otomatis ke Docker Hub menggunakan rahasia (Secrets) yang kita buat di Langkah 2
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 4. Membuat (Build) Docker image dan langsung mengirimkannya (Push) ke Docker Hub Anda
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        # Menamai image di Docker Hub sesuai dengan username Anda dan nama repositori GitHub Anda
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:latest
